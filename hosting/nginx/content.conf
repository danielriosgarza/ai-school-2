# The content host of the level 0 site (dist/content) on a host of your own, served by nginx
# (docs/publishing.md, Your own host). Replace content.school.example.org with the host name of
# origins.content in parallax.config.ts, and /srv/school/content with the folder that the
# workflow publish-own-host.yml mirrors dist/content into. nginx answers ranges itself (206,
# Content-Range, 416); these lines add the cross-origin answers that PDFs need.
server {
    listen 80;
    listen [::]:80;
    server_name content.school.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name content.school.example.org;
    ssl_certificate /etc/letsencrypt/live/content.school.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content.school.example.org/privkey.pem;

    root /srv/school/content;
    # pdf.js reads a PDF by ranges only from an answer without Content-Encoding.
    gzip off;

    location / {
        # add_header inside "if" replaces the lines outside it, so the preflight repeats them.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Headers "range";
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length";
            return 204;
        }
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length";
        try_files $uri =404;
    }
}
