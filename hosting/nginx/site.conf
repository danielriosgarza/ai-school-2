# The site host of the level 0 site (dist/site) on a host of your own, served by nginx
# (docs/publishing.md, Your own host). Replace school.example.org with the host name of
# origins.app in parallax.config.ts, and /srv/school/site with the folder that the workflow
# publish-own-host.yml mirrors dist/site into. The certificate paths are those certbot writes.
server {
    listen 80;
    listen [::]:80;
    server_name school.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name school.example.org;
    ssl_certificate /etc/letsencrypt/live/school.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.org/privkey.pem;

    root /srv/school/site;
    index index.html;

    # A file, or a folder's index.html; no fallback page.
    location / {
        try_files $uri $uri/ =404;
    }
}
