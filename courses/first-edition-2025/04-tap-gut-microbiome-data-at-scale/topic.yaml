title: "Integrating human gut microbiome data at scale: from individuals to multi-layered features in clinical and nutritional studies (Julien Tap)"
objective: >-
  Julien Tap (INRAE) follows human gut microbiome studies from a hundred samples to more
  than 35,000, through the pipelines, statistics and machine learning that turn sequencing reads
  into features, and the branched structure of the gut microbiome that emerges at that scale.
