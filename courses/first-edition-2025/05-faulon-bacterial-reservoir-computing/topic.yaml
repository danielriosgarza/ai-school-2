title: Bacterial reservoir computing (Jean-Loup Faulon)
objective: >-
  Jean-Loup Faulon (University of Paris Saclay, INRAE) asks whether the native metabolism of
  E. coli can serve as a reservoir computer, from metabolic perceptrons built in vitro to
  genome-scale models coupled with neural networks and a physical reservoir that classifies
  patient samples from bacterial growth curves.
