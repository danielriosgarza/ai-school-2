title: Sampling the solution space of metabolic networks (Haris Zafeiropoulos)
objective: >-
  Haris Zafeiropoulos (KU Leuven) contrasts optimisation with enumeration in genome-scale metabolic
  models: flux balance analysis finds one optimal state, flux sampling describes all the states a
  network allows. The hands-on part follows his notebook on flux sampling.
