id: 55361372-1c29-4abd-8523-e4b46e29a800
position: 3
title: Computational design of synthetic microbial communities (Alex Fedorec)
objective: >-
  Alex Fedorec (University College London) shows how engineered interactions between strains can
  build new communities, and how approximate Bayesian computation (ABC) finds the designs that give
  a wanted behaviour. The four notebooks model communities with generalized Lotka–Volterra
  equations, fit them with ABC rejection and ABC-SMC, and compare designs by model selection.
estimatedMinutes: 120
