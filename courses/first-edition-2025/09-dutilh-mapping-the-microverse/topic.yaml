title: Mapping the microverse and modelling its drivers (Bas Dutilh)
objective: >-
  Bas Dutilh (Friedrich Schiller University Jena) maps 22,518 metagenomes from 140 biomes into one
  microverse, and shows what separates generalist from specialist microbes. The hands-on part
  explores that map with the Microverse Mapper web application.
