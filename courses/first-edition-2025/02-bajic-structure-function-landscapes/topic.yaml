id: 3090763c-3d02-44e6-9e0a-b808fd29e13c
position: 2
title: Statistical mapping of structure-function landscapes in microbiomes (Djordje Bajić)
objective: >-
  Djordje Bajić (TU Delft) presents structure-function landscapes of microbial communities and
  global epistasis, a regularity that lets a few measured consortia predict the function of the
  rest. In the R tutorial you predict the function of unmeasured consortia and check how close the
  predicted best consortium comes to the true one.
estimatedMinutes: 120
