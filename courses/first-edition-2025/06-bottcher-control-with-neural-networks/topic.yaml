id: f72e196f-7c2a-4eac-a9db-6fdc96dc3bdd
position: 6
title: Simulation and control of high-dimensional dynamical systems using artificial neural networks (Lucas Böttcher)
objective: >-
  Lucas Böttcher (Frankfurt School of Finance & Management) shows how neural networks learn
  dynamical systems from data and learn to control them, and applies a neural ODE controller to an
  intestinal microbiota model to suppress C. difficile with as little antibiotic as possible. The
  notebooks build that controller: the lecture version, the exercises and their solutions.
estimatedMinutes: 120
