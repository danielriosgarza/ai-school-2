id: 53e9ed4d-59c0-4144-b53c-14cd367c16d6
position: 1
title: "Controlling complex microbiomes with computational intelligence: physical and virtual prototypes (Daniel Garza)"
objective: >-
  Daniel Garza (University of Paris Saclay, INRAE) argues that steering a microbiome towards a wanted
  function needs feedback control by an intelligent agent, and shows a kinetic model of a gut
  consortium driven by a reinforcement learning controller. In the tutorial you simulate a
  community with the kinetic_model package, then compare random control actions with a trained
  controller.
estimatedMinutes: 45
